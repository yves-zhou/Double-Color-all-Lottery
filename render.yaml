services:
  - type: web
    name: ssq-checker
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SSQ_API_KEY
        sync: false
      - key: SSQ_BASE_URL
        sync: false
      - key: SSQ_MODEL
        sync: false